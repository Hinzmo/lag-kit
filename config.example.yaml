# Copy to config.yaml and edit for THIS machine. config.yaml is gitignored.
ollama_base_url: "http://localhost:11434"

# These five roles are the ONLY place model names live. Personas name a role
# ("model: coder"), so swapping a model is a one-line change here and every agent
# on that role follows — no persona edits, and each machine can run a different
# model set from the same personas.
#
# Which persona sits on which role:
#   orchestrator  architect_agent, senior_dev_agent      (hardest reasoning)
#   coder         dev_agent, tester_agent, dev_research_agent
#   worker        analyst_agent, biz_analyst_agent, design_agent, research_agent
#   fast          unassigned — free for short/cheap calls
#   embed         retrieval only, never a chat model
#
# Use `ollama list` to get exact tags; a role pointing at a model you have not
# pulled fails at run time, and a mistyped role name fails immediately at load.
models:
  orchestrator: "qwen3:8b"      # Mac M4: a 14B sits here comfortably · CPU box: keep at 8B
  worker: "qwen3:4b"
  coder: "qwen2.5-coder:7b"
  fast: "llama3.2:3b"
  embed: "nomic-embed-text"     # Phase 6 RAG embeddings

swarm:
  default_mode: "crew"          # pipeline | parallel | crew

paths:
  personas: "./personas"
  memory: "./memory"

ollama:
  keep_alive: "30m"             # don't pay model-swap cost every handoff
  max_loaded_models: 2          # advisory only; set OLLAMA_MAX_LOADED_MODELS to enforce

  # Ollama ignores a model's trained context and allocates 4096 by default. Modern
  # 8B models (qwen3, ministral-3) are trained for ~256K, so leaving this unset runs
  # them at a fraction of their window and silently drops the oldest tokens. With
  # always-on retrieval plus eight tool schemas, 4096 overflows fast.
  #
  # num_ctx sets the max window AND the KV cache pre-allocated at load, so it's a
  # memory dial, not a speed dial: measured on the M4, raising it left generation
  # speed (~19 tok/s) and load time flat — only the footprint grew. Total in-memory
  # size (model weights + KV), measured:
  #             qwen3:8b     qwen3:14b
  #     8192     6.5 GB       10.3 GB
  #    16384     7.4 GB       12.3 GB
  #    32768     9.8 GB       15.0 GB   <- 14b@32k brushes swap on a 16 GB box
  # On a 16 GB M4 the safe pick with a 14B orchestrator is 8192 (~5 GB free); the
  # tradeoff is a smaller window, so lean on the memory tools (remember +
  # search_knowledge_base) to offload long-term state to the vector store.
  num_ctx: 8192
