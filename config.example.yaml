# Copy to config.yaml and edit for THIS machine. config.yaml is gitignored.
ollama_base_url: "http://localhost:11434"

models:
  orchestrator: "qwen3:8b"      # Mac M4: bump to qwen3:14b · ASUS (CPU): keep small
  worker: "qwen3:4b"
  coder: "qwen2.5-coder:7b"
  fast: "llama3.2:3b"
  embed: "nomic-embed-text"     # Phase 6 RAG embeddings

swarm:
  default_mode: "crew"          # pipeline | parallel | crew

paths:
  personas: "./personas"
  memory: "./memory"

ollama:
  keep_alive: "30m"             # don't pay model-swap cost every handoff
  max_loaded_models: 2
