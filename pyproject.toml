[project]
name = "local-agent-kit"
version = "0.2.0"
description = "Fully offline multi-agent harness over Ollama, with MCP tooling and RAG."
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4",      # local LLM client; auto-generates tool schemas from functions
    "mcp>=1.0",         # official MCP SDK (ships FastMCP as high-level interface)
    "pyyaml>=6.0",      # personas + config
    "typer>=0.12",      # `lag` CLI
]

[project.optional-dependencies]
rag = ["chromadb>=0.5", "ollama>=0.4"]   # Phase 6 — vector store + local embeddings
dev = ["pytest>=8.0", "httpx>=0.27"]     # httpx: FastAPI TestClient for the web console
study = ["pypdf>=5.0"]   # PDF course material for `lag study`
web = ["fastapi>=0.115", "uvicorn>=0.30"]   # local phosphor console (lag serve); all local

[project.scripts]
lag = "lag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lag"]
