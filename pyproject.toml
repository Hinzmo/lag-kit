[project]
name = "local-agent-kit"
version = "0.2.0"
description = "Fully offline multi-agent harness over Ollama, with MCP tooling and RAG."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Justin Hinzman" }]
dependencies = [
    "ollama>=0.4",      # local LLM client; auto-generates tool schemas from functions
    "mcp>=1.0",         # official MCP SDK (ships FastMCP as high-level interface)
    "pyyaml>=6.0",      # personas + config
    "typer>=0.12",      # `lag` CLI
]

[project.optional-dependencies]
rag = ["chromadb>=0.5", "ollama>=0.4"]   # Phase 6 — vector store + local embeddings
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]   # httpx: FastAPI TestClient · ruff: see [tool.ruff]
study = ["pypdf>=5.0"]   # PDF course material for `lag study`
web = ["fastapi>=0.115", "uvicorn>=0.30"]   # local phosphor console (lag serve); all local

[project.scripts]
lag = "lag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lag"]


# Lint config for the cleanup pass. Deliberately a short list: these are the rules that
# have actually caught something here — dead imports and names (F), likely bugs (B),
# and the simplifications that made teardown paths clearer (SIM/RET/C4/PIE).
#   .venv/bin/python -m ruff check src servers tests
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "B", "SIM", "C4", "RET", "PIE", "UP"]
# Tests monkeypatch with throwaway lambdas; naming their unused args buys nothing.
ignore = ["UP037"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# `NAMED_CREW <= stems` is a set-SUBSET assertion, not a Yoda condition. Reversing it,
# as SIM300 suggests, would invert what the test checks.
"tests/test_personas.py" = ["SIM300"]
# `lag study` is a separately-owned subsystem; its tests are left as written.
"tests/test_study.py" = ["UP031"]
