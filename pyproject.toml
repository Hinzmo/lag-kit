[project]
name = "local-agent-kit"
version = "0.2.0"
description = "Fully offline multi-agent harness over Ollama, with MCP tooling and RAG."
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4",      # local LLM client; auto-generates tool schemas from functions
    "mcp>=1.0",         # official MCP SDK (ships FastMCP as high-level interface)
    "pyyaml>=6.0",      # personas + config
    "typer>=0.12",      # `lag` CLI
]

[project.optional-dependencies]
rag = ["chromadb>=0.5"]   # Phase 6 — vector store
dev = ["pytest>=8.0"]

[project.scripts]
lag = "lag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lag"]
